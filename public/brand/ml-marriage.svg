<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="m_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff1f3" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="m_crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#700d28" />
    </linearGradient>
    <linearGradient id="m_rosegold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="m_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9f1239" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Outer Circle -->
  <circle cx="48" cy="48" r="44" fill="url(#m_bg)" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.3" />
  
  <!-- White Card Badge -->
  <circle cx="48" cy="48" r="38" fill="#ffffff" filter="url(#m_shadow)" />

  <!-- Left Ring (Groom's Band) -->
  <circle cx="38" cy="52" r="17" stroke="url(#m_crimson)" stroke-width="5.5" />
  <circle cx="38" cy="52" r="14.5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Right Ring (Bride's Band - Interlocking) -->
  <circle cx="58" cy="52" r="17" stroke="url(#m_rosegold)" stroke-width="5.5" />
  <circle cx="58" cy="52" r="14.5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Interlocking Bridge Illusion -->
  <path d="M43 40 A 17 17 0 0 1 53 43" stroke="url(#m_crimson)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Radiant Diamond Solitaire on Right Ring -->
  <g transform="translate(58, 30)">
    <!-- Prongs / Setting Base -->
    <path d="M-5 5 L-7 1 L7 1 L5 5 Z" fill="#9f1239" />
    <!-- Brilliant Cut Gem Crown -->
    <polygon points="0,-10 8,-3 6,2 -6,2 -8,-3" fill="url(#m_rosegold)" stroke="#ffffff" stroke-width="1" />
    <!-- Gem Table Facet -->
    <polygon points="0,-10 4,-4 -4,-4" fill="#ffffff" fill-opacity="0.85" />
    <polygon points="-4,-4 4,-4 3,1 -3,1" fill="#ffffff" fill-opacity="0.5" />
    
    <!-- Sparkle Rays -->
    <path d="M0 -14 L0 -17 M0 -6 L0 -3 M-5 -10 L-8 -10 M5 -10 L8 -10" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Islamic Blessed Crescent Sparkle at Top Left -->
  <path d="M26 24q0 3-3 3q3 0 3 3q0-3 3-3q-3 0-3-3z" fill="#9f1239" opacity="0.6" />
</svg>
