<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="c_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff1f3" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="c_crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="c_rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="c_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9f1239" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Outer Ambient Ring -->
  <circle cx="48" cy="48" r="44" fill="url(#c_bg)" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.35" />
  
  <!-- Inner White Card Badge -->
  <circle cx="48" cy="48" r="38" fill="#ffffff" filter="url(#c_shadow)" />

  <!-- Groom (Left) -->
  <g>
    <!-- Kufi & Head -->
    <circle cx="36" cy="32" r="10" fill="url(#c_crimson)" />
    <path d="M26 30c0-6 4.5-10 10-10s10 4 10 10v1H26v-1z" fill="#700d28" />
    <circle cx="36" cy="20" r="1.5" fill="#f43f5e" />
    <!-- Groom Body -->
    <path d="M18 68c0-11 8-18 18-18 4 0 7.5 1.5 10 4-4 3.5-7 8.5-7 14H18z" fill="url(#c_crimson)" />
    <!-- Collar Line -->
    <path d="M33 50l3 6 3-6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
  </g>

  <!-- Bride with Flowing Hijab (Right) -->
  <g>
    <!-- Hijab Drapery Outer -->
    <path d="M59 22c-7.5 0-13 5.5-13 13 0 5 2.5 9 5.5 11.5-6 3.5-9.5 9.5-9.5 17.5h34c0-8-3.5-14-9.5-17.5 3-2.5 5.5-6.5 5.5-11.5 0-7.5-5.5-13-13-13z" fill="url(#c_rose)" />
    <!-- Face Silhouette / Veil Opening -->
    <ellipse cx="58" cy="34" rx="5.5" ry="6.5" fill="#ffffff" fill-opacity="0.3" />
    <!-- Pearl Pin on Hijab -->
    <circle cx="68" cy="30" r="2.5" fill="#fff" stroke="#f43f5e" stroke-width="1" />
    <circle cx="68" cy="30" r="1" fill="#ffe4e8" />
    <!-- Soft Fold Accent -->
    <path d="M49 53q9 6 18 0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5" />
  </g>

  <!-- Uniting Golden-Rose Heart Motif at Bottom Center -->
  <g transform="translate(48, 62)">
    <path d="M0 -3 C-3 -7 -8 -5 -8 -1 C-8 4 0 8 0 8 C0 8 8 4 8 -1 C8 -5 3 -7 0 -3 Z" fill="#e11d48" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="0" cy="0" r="1" fill="#ffffff" />
  </g>

  <!-- Floating Sparkles -->
  <path d="M48 14q0 3-3 3q3 0 3 3q0-3 3-3q-3 0-3-3z" fill="#f43f5e" opacity="0.75" />
</svg>
