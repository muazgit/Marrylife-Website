<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="g_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff1f3" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="g_crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="g_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="g_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9f1239" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Outer Circle -->
  <circle cx="48" cy="48" r="44" fill="url(#g_bg)" stroke="#9f1239" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.3" />
  
  <!-- White Card Badge -->
  <circle cx="48" cy="48" r="38" fill="#ffffff" filter="url(#g_shadow)" />

  <!-- Groom Silhouette -->
  <!-- Head & Sculpted Beard Contour -->
  <circle cx="48" cy="34" r="14" fill="url(#g_crimson)" />
  
  <!-- Traditional Islamic Kufi (Prayer Cap) -->
  <path d="M34 32c0-8.5 6-14 14-14s14 5.5 14 14v2H34v-2z" fill="#700d28" />
  <!-- Kufi Embroidered Rim -->
  <path d="M34 33h28" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2 2" />
  <!-- Crescent Kufi Finial -->
  <circle cx="48" cy="18" r="2" fill="#f43f5e" />

  <!-- Jawline & Trimmed Beard Accent -->
  <path d="M39 36c0 6 4 10 9 10s9-4 9-10" fill="none" stroke="#700d28" stroke-width="2" stroke-linecap="round" />

  <!-- Sherwani / Jubbah Shoulders -->
  <path d="M22 72c0-14 11.5-22 26-22s26 8 26 22H22z" fill="url(#g_crimson)" />

  <!-- Sherwani V-Collar & Gold Buttons -->
  <path d="M42 50l6 9 6-9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5" />
  <line x1="48" y1="59" x2="48" y2="72" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Button Studs -->
  <circle cx="48" cy="62" r="1.5" fill="#f43f5e" />
  <circle cx="48" cy="67" r="1.5" fill="#f43f5e" />

  <!-- Top Right Sparkle -->
  <path d="M72 20q0 3-3 3q3 0 3 3q0-3 3-3q-3 0-3-3z" fill="#9f1239" opacity="0.6" />
</svg>
