<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="b_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff1f3" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="b_rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="b_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="b_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#e11d48" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ambient Outer Circle -->
  <circle cx="48" cy="48" r="44" fill="url(#b_bg)" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.3" />
  
  <!-- White Card Badge -->
  <circle cx="48" cy="48" r="38" fill="#ffffff" filter="url(#b_shadow)" />

  <!-- Flowing Hijab Outer Veil Silhouette -->
  <path d="M48 18c-14 0-23 9.5-23 21 0 8.5 4.5 15.5 9 19.5-7.5 4.5-12 12-12 21.5h52c0-9.5-4.5-17-12-21.5 4.5-4 9-11 9-19.5 0-11.5-9-21-23-21z" fill="url(#b_rose)" />

  <!-- Modest Oval Aperture / Veil Line -->
  <ellipse cx="48" cy="38" rx="8" ry="9.5" fill="#ffffff" fill-opacity="0.32" />

  <!-- Elegant Hijab Drape & Soft Fold Curves -->
  <path d="M33 54q15 8 30 0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
  <path d="M36 61q12 6 24 0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M40 68q8 4 16 0" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Pearl Hijab Pin / Floral Brooch on Right -->
  <g transform="translate(62, 33)">
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" stroke="#f43f5e" stroke-width="1" />
    <circle cx="0" cy="0" r="1.5" fill="#e11d48" />
    <!-- Pin stem -->
    <line x1="-1" y1="3" x2="-3" y2="7" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Crescent Star Sparkle on Top Left -->
  <path d="M26 22q0 3-3 3q3 0 3 3q0-3 3-3q-3 0-3-3z" fill="#f43f5e" opacity="0.7" />
</svg>
